name: Observe an authorized public page
on:
  workflow_dispatch:
    inputs:
      url:
        description: Public HTTP(S) page URL you are authorized to inspect; appears in logs/artifacts.
        required: true
        default: https://example.org/
        type: string
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: mhdteto/search-ai-audit-action@9c4295aaf7574278e33eabaf5392197ce37ceb06
        with:
          url: ${{ inputs.url }}
          output-dir: reports/live
      - uses: actions/upload-artifact@v4
        with:
          name: live-discoverability
          path: reports/live/
          if-no-files-found: error
          retention-days: 7
